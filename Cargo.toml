[package]
name = "egui-bevy"
version = "0.2.4"
edition = "2024"
description = "Integration between egui and Bevy"
repository = "https://github.com/rustbasic/egui-bevy"
homepage = "https://github.com/rustbasic/egui-bevy"
documentation = "https://docs.rs/egui-bevy"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "egui_bevy"
path = "src/lib.rs"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["std", "bevy_render", "bevy_core_pipeline", "bevy_window", "keyboard", "mouse", "system_clipboard"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_system_font_provider = "0.37.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "Clipboard", "CompositionEvent", "CssStyleDeclaration", "Document", "Event", "EventTarget", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "ImageData", "InputEvent", "KeyboardEvent", "Navigator", "TextMetrics", "Window"] }
wgpu = { version = "30", default-features = false, features = ["webgpu"] }

[target.'cfg(all(target_arch = "wasm32", not(target_feature = "atomics")))'.dependencies]
egui-wgpu = { version = "0.37.0", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
