[package]
name = "graphics-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "3d"] }
bevy_render = { version = "=0.20.1", features = ["gles"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-bevy = { path = "../.." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"