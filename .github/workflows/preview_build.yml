name: Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install Binaryen
        run: sudo apt-get update && sudo apt-get install --yes binaryen
      - name: Install Trunk
        run: cargo install trunk --version 0.22.2 --locked
      - name: Build the WebAssembly preview
        working-directory: examples/wasm-3d-overlay
        run: trunk build --release --dist ../../preview-site --public-url ./
      - name: Record preview metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p preview-meta
          printf '%s\n' "$PR_NUMBER" > preview-meta/pr-number
          printf '%s\n' "$PR_HEAD_SHA" > preview-meta/head-sha
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview-site
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: preview-meta
          path: preview-meta
          retention-days: 3