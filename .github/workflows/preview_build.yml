name: Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build the WebAssembly example
        run: cargo build --release --manifest-path examples/wasm-3d-overlay/Cargo.toml --target wasm32-unknown-unknown
      - name: Generate preview site
        run: |
          mkdir -p preview-site
          wasm-bindgen --target web --out-dir preview-site --out-name wasm_3d_overlay examples/wasm-3d-overlay/target/wasm32-unknown-unknown/release/egui-bevy-wasm-3d-overlay.wasm
          cp examples/wasm-3d-overlay/index.html preview-site/index.html
      - name: Record preview metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p preview-meta
          printf '%s\n' "$PR_NUMBER" > preview-meta/pr-number
          printf '%s\n' "$PR_HEAD_SHA" > preview-meta/head-sha
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview-site
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: preview-meta
          path: preview-meta
          retention-days: 3