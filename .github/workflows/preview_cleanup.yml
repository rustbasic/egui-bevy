name: Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: read

concurrency:
  group: pr-preview-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm the PR remains closed
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput('number', pr.state === 'closed' ? String(number) : '');
      - name: Configure deploy key
        if: steps.pr.outputs.number != ''
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Remove only this PR preview
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git clone --depth 1 --branch main git@github.com:rustbasic/egui-bevy-pr-preview.git preview-repo
          if [ -d "preview-repo/pr/$PR_NUMBER" ]; then
            rm -rf "preview-repo/pr/$PR_NUMBER"
            git -C preview-repo config user.name 'github-actions[bot]'
            git -C preview-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C preview-repo add -A -- "pr/$PR_NUMBER"
            git -C preview-repo commit -m "Remove preview for PR $PR_NUMBER"
            git -C preview-repo push origin main
          fi